services:
  app:
    build: .
    container_name: rollcall-app
    volumes:
      - ./data:/app/data        # fernet.key + rollcall.db 持久化
    expose:
      - "8200"                  # 仅容器网络内可见，由 caddy 反代到 8200
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: rollcall-caddy
    ports:
      - "8200:8200"             # 对外唯一端口（自签 HTTPS）
    environment:
      - TZ=Asia/Shanghai
      - SITE_IP=${SITE_IP}      # 从 .env 注入，Caddyfile 用于证书 SAN 与站点地址
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # 证书存储（含自签根证书 root.crt）
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
